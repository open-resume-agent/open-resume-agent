# Publishes to PyPI, then lists the MCP server in the MCP Registry, when a GitHub release is published.
# Uses PyPI trusted publishing: no token is stored anywhere.
# One-time setup on pypi.org (project "open-resume-agent" > Publishing): add a trusted publisher with
# owner "open-resume-agent", repository "open-resume-agent", workflow "publish.yml", environment "pypi".
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt build
      - name: Versions agree
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python - "$v" <<'PY'
          import json, re, sys
          v = sys.argv[1]; s = json.load(open("server.json"))
          assert s["version"] == v and all(p["version"] == v for p in s["packages"]), f"server.json does not match pyproject {v}"
          init = open("ora_tools/__init__.py").read()
          assert re.search(rf'__version__ = "{re.escape(v)}"', init), f"ora_tools/__init__.py does not match pyproject {v}"
          assert f"v{v}" == "${{ github.event.release.tag_name }}", "release tag does not match pyproject version"
          PY
      - run: make validate test TODAY=2026-11-17
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Sign in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        # PyPI can take a minute to serve a new release, and the registry checks it.
        run: |
          for i in 1 2 3 4 5 6; do ./mcp-publisher publish && exit 0; sleep 30; done
          exit 1
