name: ci
on:
  push:
  pull_request:
jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Schema is up to date
        run: python3 tools/build_schema.py && git diff --exit-code schema/
      - name: Agent files are up to date
        run: make agents TODAY=2026-11-17 && git diff --exit-code agents/
      - run: make validate test TODAY=2026-11-17
